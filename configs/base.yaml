project:
  name: ClinHallu
  protocol_version: 3

experiment:
  name: c5
  kind: adaptation

model:
  type: gaer_plus_plus
  encoder: microsoft/deberta-v3-base
  revision: 559062ad13d311b87b2c455e67dcd5f1c8f65111
  hidden_dim: 768
  classifier_hidden_dim: 512
  max_length: 512
  dropout: 0.15
  num_attention_heads: 8
  attn_implementation: eager
  ablation_mode: null

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  target_modules:
    - query_proj
    - key_proj
    - value_proj
    - attention.output.dense

grounding:
  temperature: 1.0
  use_low_grounding_fraction: false

data:
  train_path: data/raw/train.jsonl
  val_path: data/raw/val.jsonl
  eval_path: data/raw/eval_data.jsonl
  processed_dir: data/processed/c5
  cache_dir: data/cache
  use_cache: true
  overlap_policy: error
  expected_rows:
    train: 14000
    validation: 4000
    test: 1000
  minimum_class_fraction: 0.35
  num_workers: 0
  question_budget: 96
  answer_budget: 128
  context_selection:
    enabled: true
    max_context_tokens: 280
    max_sentences: 8
    question_weight: 0.45
    answer_weight: 0.45
    entity_weight: 0.10
    min_leading_sentences: 1

training:
  seed: 13
  batch_size: 8
  validation_batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  head_learning_rate: 1.0e-4
  llrd_decay: 0.95
  weight_decay: 0.01
  max_epochs: 5
  warmup_ratio: 0.10
  max_grad_norm: 1.0
  mixed_precision: true
  early_stopping_patience: 2
  gradient_checkpointing: true

evaluation:
  batch_size: 8
  mixed_precision: true
  bootstrap_samples: 1000

checkpoints:
  best_filename: best_model.pt
  latest_filename: latest_checkpoint.pt
  # Mid-epoch resume points. A save happens at whichever limit comes first, so
  # an interrupted run loses at most this much work rather than a whole epoch.
  # Saves only occur at optimizer-step boundaries, so no gradients are ever
  # pending in a checkpoint.
  save_every_steps: 200
  save_every_minutes: 10

calibration:
  temperature_filename: temperature.npy
  threshold_filename: threshold.npy

output:
  root: artifacts

labels:
  grounded: 0
  hallucinated: 1

logging:
  level: INFO
